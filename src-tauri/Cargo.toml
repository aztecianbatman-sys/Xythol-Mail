[package]
name = "xythol_mail"
version = "0.2.0"
description = "Xythol Mail desktop application"
authors = ["Xythol Mail"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "xythol_mail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2.11.0"

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1", features = ["derive"] }
url = "2"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
